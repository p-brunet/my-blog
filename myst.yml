version: 1
project:
  title: p-brunet
  description: Geospatial projects, maps and energy analysis by Paul Brunet.
  copyright: '2026'
  keywords:
    - GIS
    - Geospatial
    - Energy
    - Data Engineering
    - Visualization
  github: p-brunet/my-blog
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - fonts/**
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
  toc:
    - file: index.md
    - file: projects/data-engineering.md
    - file: projects/maps.md
    - file: projects/modelling.md
    - file: data-sources.md
    - file: contact.md
    - pattern: posts/*.md
      hidden: true
site:
  options:
    logo: logo.png
    logo_dark: logo.png
    logo_url: /my-blog/
    favicon: logo.png
    style: custom.css
    hide_authors: true
    # analytics_google: G-XXXXXXXXXX
    folders: true
  actions:
    - title: LinkedIn
      url: https://www.linkedin.com/in/brunet-paul1/?locale=en-US
  template: book-theme
  parts:
    primary_sidebar_footer: ''
    footer: |
      [GitHub](https://github.com/p-brunet) |
      [LinkedIn](https://www.linkedin.com/in/brunet-paul1/?locale=en-US)
